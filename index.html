<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f19" />
    <script>
      // apply the saved theme before the first paint (the same rules as src/theme.ts)
      (() => {
        const t = localStorage.getItem('soiduk.theme');
        const light = t === 'light' || (t !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (light) document.querySelector('meta[name="theme-color"]').content = '#f3f5fa';
      })();
    </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sõiduk" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Sõiduk</title>
</head>
<body>
  <div id="live" class="live" hidden>
    <span id="live-text"></span>
    <button type="button" class="pulse" data-act="reload" data-i18n-aria="aria.reload"><span class="dot"></span></button>
    <button type="button" class="icon" data-act="edit" data-i18n-aria="aria.settings">⚙</button>
  </div>
  <div id="app"></div>
  <div id="picker" hidden></div>
  <div id="trip" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
